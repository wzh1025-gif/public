<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="author" content="王泽恒">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漫剧片场｜AI短漫剧通关手册</title>
<!-- 联网时加载标题字体，离线时自动回退到系统字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12123A; --ink2:#1B1B4F; --ink3:#28286C; --line:#35358C; --deep:#0C0C2C;
  --paper:#EEF0FF; --mute:#A3A6D9;
  --pink:#FF4F9A; --yel:#FFD84A; --cyan:#3FE6D0; --vio:#B69CFF; --org:#FF9B5E; --blue:#7FB2FF; --hh:62px;
  --disp:"ZCOOL QingKe HuangYou","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --body:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hh) + 60px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.75 var(--body);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(255,255,255,.05) 1.2px,transparent 1.4px);background-size:18px 18px}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
a{color:inherit}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:calc(10px + var(--st)) clamp(14px,3vw,36px) 10px;
  background:rgba(18,18,58,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.logo-mark{display:grid;place-items:center;width:38px;height:38px;background:var(--pink);color:var(--ink);font:28px/1 var(--disp);transform:rotate(-6deg);box-shadow:3px 3px 0 var(--yel);border-radius:4px}
.logo b{display:block;font:22px/1.1 var(--disp);letter-spacing:.04em}
.logo small{display:block;font-size:11px;color:var(--mute);line-height:1.3}
.tabs{display:flex;gap:2px}
.tabs a{text-decoration:none;color:var(--mute);padding:6px 12px;border-radius:8px;font-weight:700;font-size:14px;white-space:nowrap}
.tabs a:hover{color:var(--paper)}
.tabs a.on{background:var(--c);color:var(--ink)}
.search{margin-left:auto;position:relative;width:min(320px,38vw)}
.search input{width:100%;background:var(--ink2);border:2px solid var(--line);color:var(--paper);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px}
.search input:focus{outline:none;border-color:var(--cyan)}
.search input::placeholder{color:var(--mute)}
.results{position:absolute;right:0;top:calc(100% + 8px);width:min(440px,calc(100vw - 28px));max-height:60vh;overflow:auto;background:var(--ink2);border:2px solid var(--cyan);border-radius:12px;padding:6px;box-shadow:6px 6px 0 rgba(0,0,0,.4)}
.results button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--ink3)}
.results .rt{font-weight:700;display:block}
.results .rx{font-size:12.5px;color:var(--mute);display:block;line-height:1.5}
.results .empty{padding:10px;color:var(--mute);font-size:14px}
.stampmini{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:5px;background:var(--c);color:var(--ink);font:15px/1 var(--disp);margin-top:2px}

/* ---------- 手机底部导航 ---------- */
.bottombar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(18,18,58,.96);border-top:2px solid var(--line);padding:6px 2px calc(6px + var(--sb));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bottombar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);text-decoration:none;font-size:11px;font-weight:700}
.bottombar .st{display:grid;place-items:center;width:30px;height:30px;border:2px solid currentColor;border-radius:7px;font:18px/1 var(--disp)}
.bottombar a.on{color:var(--c)}
.bottombar a.on .st{background:var(--c);border-color:var(--c);color:var(--ink);transform:rotate(-6deg)}

/* ---------- 视图 ---------- */
main{min-height:80vh}
.view{display:none;max-width:1240px;margin:0 auto;padding:28px clamp(14px,4vw,48px) 90px}
.view.on{display:block}
.vhead{display:flex;gap:18px;align-items:center;margin:4px 0 26px}
.bigstamp{flex:none;display:grid;place-items:center;width:clamp(64px,10vw,92px);aspect-ratio:1;border:4px solid var(--c);color:var(--c);font:clamp(44px,7vw,64px)/1 var(--disp);border-radius:12px;transform:rotate(-5deg);box-shadow:5px 5px 0 rgba(0,0,0,.35)}
h2{font:clamp(30px,5vw,46px)/1.1 var(--disp);margin:0 0 6px;letter-spacing:.02em}
.lead{color:var(--mute);max-width:58ch;margin:0}
h3{margin:0}
.sub{font:26px/1.2 var(--disp);margin:44px 0 16px}

/* ---------- 通用组件 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--c,var(--paper));color:var(--ink);border:0;border-radius:10px;padding:9px 18px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.4);text-decoration:none;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.4)}
.btn.ghost{background:transparent;color:var(--paper);border:2px solid var(--line);box-shadow:none;padding:7px 14px}
.btn.ghost:hover{border-color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip:hover{color:var(--paper);border-color:var(--paper)}
.chip.on{background:var(--c);border-color:var(--c);color:var(--ink)}
.tag{flex:none;font-size:12px;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--ink3);color:var(--mute)}
.mbtn{background:transparent;border:2px dashed var(--line);color:var(--mute);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}
.mbtn:hover{border-color:var(--cyan);color:var(--cyan)}
.mbtn.on{border-style:solid;border-color:var(--cyan);background:var(--cyan);color:var(--ink)}
.code{display:flex;gap:8px;align-items:flex-start;background:var(--deep);border-radius:10px;padding:10px 10px 10px 14px;font-size:13.5px;line-height:1.6;color:var(--cyan)}
.code code{flex:1;font-family:inherit;word-break:break-word}
.code button{flex:none;background:var(--ink3);border:0;color:var(--paper);border-radius:7px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.code button:hover{background:var(--cyan);color:var(--ink)}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(63,230,208,0)}30%{box-shadow:0 0 0 6px rgba(63,230,208,.8)}}
.flash{animation:flash 1.4s ease 2}

/* ---------- 首页 ---------- */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(22px,4vw,52px);align-items:center;padding:6px 0 44px}
.hero h1{font:clamp(44px,7.4vw,88px)/1.02 var(--disp);margin:0 0 18px;letter-spacing:.02em;text-shadow:4px 4px 0 var(--pink)}
.hero .lead{margin-bottom:22px}
.hero-stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 26px;padding:0;list-style:none;font-size:14px;color:var(--mute)}
.hero-stats b{font:24px/1 var(--disp);color:var(--c);margin-right:4px}
.sec{font:clamp(26px,4vw,34px)/1.2 var(--disp);margin:8px 0 18px}
.panels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(180px,auto);gap:14px}
.panel{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:20px;background:var(--ink2);border:3px solid var(--paper);border-radius:4px;text-decoration:none;overflow:hidden;transition:transform .18s,box-shadow .18s;isolation:isolate}
.panel::before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(var(--c) 1.6px,transparent 1.8px);background-size:13px 13px;opacity:.28;
  -webkit-mask-image:linear-gradient(200deg,#000 0%,transparent 60%);mask-image:linear-gradient(200deg,#000 0%,transparent 60%)}
.panel:hover{transform:translate(-4px,-4px);box-shadow:7px 7px 0 var(--c)}
.panel .pst{position:absolute;top:-8px;right:10px;font:clamp(90px,12vw,150px)/1 var(--disp);color:var(--c);opacity:.95;transform:rotate(-8deg);z-index:-1;transition:transform .25s}
.panel:hover .pst{transform:rotate(4deg) scale(1.06)}
.panel h3{font:clamp(26px,3vw,34px)/1.1 var(--disp)}
.panel p{margin:0;color:var(--mute);font-size:14px}
.panel .peek{display:flex;flex-direction:column;gap:6px;margin:0 0 auto;padding:0;list-style:none;max-width:70%}
.panel .peek li{font-size:13.5px;background:var(--deep);border-left:3px solid var(--c);padding:5px 10px;border-radius:0 6px 6px 0}
.panel .row{display:flex;flex-wrap:wrap;gap:6px}
.panel .row span{font-size:12px;font-weight:700;border:1.5px solid var(--c);color:var(--c);border-radius:999px;padding:0 9px}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mute)}
.pbar{flex:1;height:6px;background:var(--ink3);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--c);transition:width .5s}
.panel:nth-child(1){grid-column:span 3;grid-row:span 2}
.panel:nth-child(2),.panel:nth-child(3){grid-column:span 3}
.panel:nth-child(4),.panel:nth-child(5),.panel:nth-child(6){grid-column:span 2}

/* ---------- 取景器 ---------- */
.vf-screen{position:relative;aspect-ratio:16/9;width:100%;border-radius:12px;overflow:hidden;border:3px solid var(--paper);background:#000;box-shadow:8px 8px 0 rgba(0,0,0,.4);margin:0 auto}
.vf.vert .vf-screen{aspect-ratio:9/16;width:min(100%,calc(68vh * 9 / 16),420px)}
@media (max-width:860px){.vf.vert .vf-screen{width:min(100%,calc(58vh * 9 / 16))}}
.vf .scene{position:absolute;inset:0;width:100%;height:100%;transition:filter .5s;display:block}
.grade-ov{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:0;transition:opacity .5s}
.guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.guide *{stroke:var(--cyan);stroke-width:1.5;fill:none;vector-effect:non-scaling-stroke}
.hud{position:absolute;inset:0;pointer-events:none;font-size:clamp(10px,1.4vw,13px);font-weight:700;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.hud .rec{position:absolute;top:12px;left:16px;display:flex;align-items:center;gap:6px}
.hud .rec i{width:9px;height:9px;border-radius:50%;background:#ff3b3b;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hud .tc{position:absolute;top:12px;right:16px}
.hud .hs{position:absolute;left:14px;bottom:12px;background:var(--yel);color:var(--ink);text-shadow:none;font:clamp(15px,2.2vw,22px)/1.2 var(--disp);padding:2px 10px;border-radius:4px;transform:rotate(-3deg)}
.hud .hr{position:absolute;right:16px;bottom:14px}
.hud .cn{position:absolute;width:22px;height:22px;border:0 solid rgba(255,255,255,.85)}
.cn.a{top:34px;left:10px;border-top-width:2px;border-left-width:2px}
.cn.b{top:34px;right:10px;border-top-width:2px;border-right-width:2px}
.cn.c{bottom:44px;left:10px;border-bottom-width:2px;border-left-width:2px}
.cn.d{bottom:44px;right:10px;border-bottom-width:2px;border-right-width:2px}
.sizer{margin:16px auto 0;max-width:640px}
.vf.vert .sizer{max-width:420px}
.sizer input{-webkit-appearance:none;appearance:none;width:100%;height:8px;background:var(--ink3);border-radius:4px;margin:10px 0 6px;cursor:pointer}
.sizer input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;background:var(--yel);border:3px solid var(--ink);border-radius:5px;transform:rotate(45deg);box-shadow:0 0 0 2px var(--yel)}
.sizer input::-moz-range-thumb{width:20px;height:20px;background:var(--yel);border:3px solid var(--ink);border-radius:5px;box-shadow:0 0 0 2px var(--yel)}
.ticks{display:flex;justify-content:space-between}
.ticks button{background:none;border:0;color:var(--mute);font-size:13px;font-weight:700;padding:4px 2px;cursor:pointer}
.ticks button.on{color:var(--yel)}
.hint{font-size:12.5px;color:var(--mute);text-align:center;margin:8px 0 0}

/* ---------- 诊断 ---------- */
.dx{background:var(--ink2);border:2px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;transition:border-color .2s}
.dx.open{border-color:var(--pink)}
.dx-h{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;background:none;border:0;text-align:left;cursor:pointer}
.dx-t{flex:1;font-weight:700;font-size:17px;line-height:1.45}
.chev{flex:none;font-size:22px;line-height:1;color:var(--mute);transition:transform .25s}
.dx.open .chev{transform:rotate(90deg);color:var(--pink)}
.dx-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.dx.open .dx-b{grid-template-rows:1fr}
.dx-b>div{overflow:hidden}
.dx-in{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;padding:4px 18px 18px}
.dx.open .dx-in::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--pink);box-shadow:0 0 14px var(--pink);animation:scan .8s ease-out forwards}
@keyframes scan{from{top:0;opacity:1}to{top:100%;opacity:0}}
.blk h4{margin:0 0 4px;font-size:13.5px;color:var(--pink)}
.blk p{margin:0;color:#D7D9F5}
.blk ol{margin:0;padding-left:20px;color:#D7D9F5}
.blk.wide{grid-column:1/-1}

/* ---------- 提示词 ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:16px;margin-top:18px}
.pc{background:var(--ink2);border:2px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.pc-top{display:flex;align-items:center;gap:10px}
.pc h3{font-size:18px}
.pc .use{margin:0;color:var(--mute);font-size:14px}
.tpl{background:var(--deep);border-radius:10px;padding:14px 16px;line-height:2.05;font-size:14.5px;white-space:pre-wrap;border-left:4px solid var(--yel);color:#DADCF7}
.slot{padding:1px 6px;border-radius:6px;background:rgba(255,216,74,.14);color:var(--yel);border-bottom:2px dashed var(--yel);outline:none;cursor:text}
.slot::before{content:attr(data-k) "：";font-size:11px;opacity:.65}
.slot:focus{background:rgba(255,216,74,.3)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- 镜头 ---------- */
.shotwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(20px,4vw,40px);align-items:start}
.ctrl{display:flex;flex-direction:column;gap:20px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;padding:3px;align-self:flex-start}
.seg button{background:none;border:0;padding:5px 14px;border-radius:7px;color:var(--mute);font-weight:700;font-size:14px;cursor:pointer}
.seg button.on{background:var(--c,var(--cyan));color:var(--ink)}
.grp h4{font:19px/1.2 var(--disp);margin:0 0 8px}
.explain{background:var(--ink2);border:2px solid var(--cyan);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:6px 6px 0 rgba(63,230,208,.25)}
.explain .ex-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.explain h3{font:32px/1.1 var(--disp)}
.explain .en{color:var(--mute);font-size:13px}
.explain p{margin:0;color:#D7D9F5}
.explain .use b{color:var(--cyan);margin-right:6px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.ac{background:var(--ink2);border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.ac h4{margin:0;font:22px/1.2 var(--disp)}
.ac p{margin:0;font-size:14px;color:#D7D9F5}
.ac .glyph{height:54px}
.ac .glyph *{stroke:var(--cyan);stroke-width:2;fill:none}
.ac .glyph .fill{fill:var(--cyan);stroke:none}

/* ---------- 风格 ---------- */
.gacha{display:flex;align-items:center;gap:16px 22px;flex-wrap:wrap;background:var(--ink2);border:2px dashed var(--c);border-radius:14px;padding:16px 20px;margin-bottom:22px}
.gacha .slotbox{flex:1;min-width:220px;font:clamp(20px,3.2vw,30px)/1.25 var(--disp)}
.gacha .slotbox small{display:block;font:14px/1.6 var(--body);color:var(--mute);margin-top:4px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.sc{background:var(--ink2);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s,transform .2s}
.sc.hit{border-color:var(--vio);box-shadow:0 0 0 5px rgba(182,156,255,.35);transform:translateY(-4px)}
.sc-art{position:relative;height:160px;overflow:hidden}
.sc-art svg{position:absolute;right:6%;bottom:0;height:92%}
.sc-art .sw{position:absolute;left:14px;top:14px;display:flex;gap:6px}
.sc-art .sw i{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.8)}
.sc-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.sc-b .en{color:var(--mute);font-size:13px;margin-left:8px;font-weight:400}
.sc-b h3{font:24px/1.2 var(--disp)}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw button{background:var(--deep);border:1.5px solid var(--line);color:var(--vio);border-radius:6px;padding:1px 9px;font-size:13px;cursor:pointer}
.kw button:hover{border-color:var(--vio)}
.sc-b dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.sc-b dt{color:var(--vio);font-weight:700}
.sc-b dd{margin:0;color:#D7D9F5}

/* ---------- 词典闪卡 ---------- */
.dtool{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.dtool input{flex:1;min-width:180px;background:var(--ink2);border:2px solid var(--line);color:var(--paper);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px}
.dtool input:focus{outline:none;border-color:var(--org)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.fc{perspective:1100px;cursor:pointer;min-height:230px;background:none;border:0;padding:0;text-align:left}
.fc-in{position:relative;height:100%;min-height:230px;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:18px;display:flex;flex-direction:column}
.fc-f{background:var(--ink2);border:2px solid var(--line);justify-content:space-between}
.fc-f .term{font:clamp(28px,3.4vw,34px)/1.15 var(--disp)}
.fc-f .turn{font-size:12.5px;color:var(--mute)}
.fc:hover .fc-f{border-color:var(--org)}
.fc-b{background:var(--paper);color:var(--ink);transform:rotateY(180deg);overflow:auto;gap:8px;font-size:14px;line-height:1.65}
.fc-b h4{margin:0;font:20px/1.2 var(--disp);color:#B03A70}
.fc-b p{margin:0}
.fc-b .ex{background:#DFE2FF;border-radius:8px;padding:6px 10px;font-size:13px}
.fc-b .mbtn{align-self:flex-start;margin-top:auto;color:#4A4C8A;border-color:#A3A6D9}
.fc-b .mbtn.on{background:var(--ink);border-color:var(--ink);color:var(--cyan)}
.fc-f .tag{align-self:flex-start;background:var(--org);color:var(--ink)}
.fc.done .fc-f::after{content:"已掌握";position:absolute;right:14px;top:14px;font-size:12px;font-weight:700;color:var(--cyan)}

/* ---------- 抽题 / 转场 / 提示 ---------- */
.dice{position:fixed;right:18px;bottom:calc(22px + var(--sb));z-index:45;display:flex;align-items:center;gap:6px;background:var(--yel);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:9px 16px 9px 12px;font-weight:700;font-size:15px;box-shadow:4px 4px 0 var(--pink);cursor:pointer;transition:transform .15s}

.dice .d{display:inline-block;font-size:20px;line-height:1}
.dice:hover .d{animation:roll .5s}
@keyframes roll{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,8,30,.78);display:grid;place-items:center;padding:20px}
.mcard{position:relative;width:min(460px,100%);max-height:86vh;overflow:auto;background:var(--ink2);border:3px solid var(--paper);border-radius:16px;padding:24px;box-shadow:8px 8px 0 var(--pink);animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.85) rotate(-3deg);opacity:0}}
.mcard .x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:26px;color:var(--mute);cursor:pointer;line-height:1}
.mcard .q{font:clamp(24px,5vw,30px)/1.3 var(--disp);margin:12px 0 18px}
.mcard .a{background:var(--deep);border-radius:10px;padding:14px;color:#D7D9F5;margin-bottom:18px;font-size:14.5px}
.mcard .a ol{margin:0;padding-left:20px}
#wipe{position:fixed;top:0;bottom:0;left:-25%;right:-25%;z-index:80;pointer-events:none;display:grid;place-items:center;background:var(--c,var(--pink));transform:translateX(-130%) skewX(-14deg)}
#wipe::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(18,18,58,.18) 0 3px,transparent 3px 22px)}
#wipe span{position:relative;font:min(40vw,320px)/1 var(--disp);color:var(--ink);transform:skewX(14deg)}
#wipe.run{animation:wipe .55s cubic-bezier(.7,0,.3,1) forwards}
@keyframes wipe{0%{transform:translateX(-130%) skewX(-14deg)}42%,58%{transform:translateX(0) skewX(-14deg)}100%{transform:translateX(130%) skewX(-14deg)}}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--sb));z-index:90;transform:translate(-50%,20px);background:var(--cyan);color:var(--ink);font-weight:700;padding:8px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;box-shadow:3px 3px 0 var(--ink)}
#toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--mute);font-size:12.5px;padding:0 16px 30px}


/* ---------- v2：章节与通用块 ---------- */
.subnav{position:sticky;top:var(--hh);z-index:30;display:flex;align-items:center;gap:12px;margin:0 calc(-1 * clamp(14px,4vw,48px)) 8px;padding:8px clamp(14px,4vw,48px);background:rgba(18,18,58,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.subnav-in{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.subnav-in::-webkit-scrollbar{display:none}
.subnav-in button{flex:none;background:none;border:0;color:var(--mute);font-weight:700;font-size:14px;padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}

.subnav-in button.on{background:var(--c);color:var(--ink)}
.showall{flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);cursor:pointer;white-space:nowrap}
.showall input{accent-color:var(--c);width:16px;height:16px}
.sect{padding-top:34px}
.sect-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.sect-h h3{font:clamp(24px,3.6vw,32px)/1.2 var(--disp);flex:1;min-width:60%}
.sect-h h3::before{content:"";display:inline-block;width:12px;height:12px;background:var(--c);transform:rotate(45deg);margin:0 12px 4px 0}
.lead2{color:var(--mute);margin:0 0 18px;max-width:72ch}
.h4{font:20px/1.3 var(--disp);margin:30px 0 12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.h4 small{font:13.5px/1.5 var(--body);color:var(--mute)}
.note{margin:14px 0 0;padding:10px 14px;border-left:4px solid var(--c);background:rgba(255,255,255,.04);border-radius:0 10px 10px 0;font-size:14px;color:#D7D9F5;max-width:90ch}
.small{font-size:13px;color:var(--mute);margin:6px 0 0}
.ex{font-size:13.5px;color:var(--mute);margin:6px 0 0}
.big{font-size:16.5px;font-weight:700;margin:0 0 4px;line-height:1.6}
.k{display:inline-block;font-size:12px;font-weight:700;color:var(--c);border:1.5px solid var(--c);border-radius:5px;padding:0 6px;margin-right:8px;line-height:1.6}
.grid2,.grid3,.grid4,.grid5{display:grid;gap:12px}
.grid2{grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))}
.grid3{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.grid4{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.grid5{grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.card{background:var(--ink2);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:#D7D9F5;text-align:left}
.card>b{display:block;color:var(--paper);font-size:16px;margin-bottom:4px}
.card p{margin:4px 0 0}
.card ul,.card ol{margin:6px 0 0;padding-left:20px}
.card.quote{font-size:15.5px;border-color:var(--c);margin:10px 0 0}
.mbtn.sm{padding:3px 10px;font-size:12px}
.chip small{margin-left:6px;opacity:.6;font-size:11.5px}
.chips.static .chip{cursor:default}
.btn.sm{padding:4px 10px;font-size:13px}
.tblwrap{overflow-x:auto;border-radius:12px;border:2px solid var(--line)}
.tblwrap table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
.tblwrap th,.tblwrap td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tblwrap thead th{background:var(--ink3);font-size:13px;color:var(--paper)}
.tblwrap tbody th{color:var(--paper);white-space:nowrap}
.tblwrap td{color:#D7D9F5}
.tblwrap tr:last-child>*{border-bottom:0}
.cmp td.hl{color:var(--c);font-weight:700}
.cmp td.bad{color:#FFB3CF}
.cmp td.good{color:var(--cyan)}

/* 先错后对 */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.ba>div{border-radius:12px;padding:12px 14px;font-size:14px;position:relative}
.ba>div>b{display:block;font-size:12.5px;margin-bottom:6px}

.ba-bad{background:rgba(255,79,154,.08);border:2px solid rgba(255,79,154,.45);color:#E9D4E0}

.ba-good{background:rgba(63,230,208,.07);border:2px solid rgba(63,230,208,.45);color:#D6F7F2}
.ba-good>b{color:var(--cyan)}
.ba-in{transition:filter .35s,opacity .35s}
.ba-good.locked .ba-in{filter:blur(6px);opacity:.4;user-select:none;pointer-events:none}
.ba-rev{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);background:var(--cyan);color:var(--ink);border:0;border-radius:999px;padding:6px 16px;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.4);white-space:nowrap}
body.show-all .ba-good.locked .ba-in{filter:none;opacity:1;pointer-events:auto}
body.show-all .ba-rev{display:none}
.grid2>.ba{grid-template-columns:1fr}

/* ---------- 诊断 ---------- */
.motto{margin:0 0 20px;padding:22px 24px;border:3px solid var(--c);border-radius:16px;background:var(--ink2);box-shadow:6px 6px 0 rgba(255,79,154,.3)}

.cc{display:flex;flex-wrap:wrap;gap:6px}
.cchip{background:var(--deep);border:1.5px solid var(--pink);color:var(--pink);border-radius:6px;padding:1px 9px;font-size:13px;font-weight:700;cursor:pointer}

.x3{flex:none;font:56px/1 var(--disp);color:var(--yel);transform:rotate(-8deg)}
.risk{background:var(--ink2);border:2px solid var(--line);border-radius:16px;padding:20px}
.formula{font:clamp(18px,2.6vw,24px)/1.5 var(--disp);margin-bottom:14px}
.formula b{color:var(--c);font-weight:400}
.rrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 170px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rrow label b{display:block}
.rrow label small{color:var(--mute);font-size:12.5px}
.rrow input{width:100%;accent-color:var(--c)}
.rv{font-size:13.5px;font-weight:700;color:var(--yel)}
.rmeter{margin:14px 0 10px}
.rbar{height:16px;background:var(--ink3);border-radius:8px;overflow:hidden}
.rbar i{display:block;height:100%;transition:width .4s,background .4s;border-radius:8px}
.rout{display:flex;gap:12px;align-items:baseline;margin-top:6px}

.rout span{color:var(--mute);font-size:13.5px}
.rtips{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.dxlist{margin-top:14px}
.dx-in>.wide{grid-column:1/-1}

.crow{display:grid;grid-template-columns:60px minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:center}

.cbar{height:26px;background:var(--ink3);border-radius:6px;position:relative;overflow:hidden}
.cbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--yel) 50%,var(--pink))}

.layers3{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 0}

.formcard{background:var(--ink2);border:2px dashed var(--c);border-radius:16px;padding:16px 18px}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px;margin-bottom:12px}

.stages4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}

/* ---------- 剧本 ---------- */

.lsteps{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lsteps>i{font-style:normal;color:var(--mute)}
.lstep{display:flex;flex-direction:column;align-items:flex-start;background:var(--deep);border:2px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;min-width:100px}

.orow{display:flex;gap:10px;align-items:flex-start;background:var(--ink2);border-radius:10px;padding:8px 12px;border-left:4px solid var(--cyan)}

.orow p{margin:0;font-size:14px}
.orow small{color:var(--mute);font-size:12.5px}
.oi{font-weight:700;color:var(--cyan)}
.orow.no .oi{color:var(--pink)}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px}
.flip{position:relative;background:var(--ink2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;min-height:64px;font-size:14px}
.flip .o{display:none;font:22px/1.3 var(--disp);color:var(--cyan)}
.flip.on{border-color:var(--cyan)}
.flip.on .w{display:block;color:var(--mute);text-decoration:line-through;font-size:12.5px}
.flip.on .o{display:block}
.flip:not(.on)::after{content:"点我改";position:absolute;right:10px;bottom:6px;font-size:11px;color:var(--c)}
.hj{display:grid;gap:10px}
.hjitem{background:var(--ink2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .3s}
.hjitem>p{margin:0 0 8px;font-size:15px}
.hjitem.right{border-color:var(--cyan)}
.hjitem.wrong{border-color:var(--pink)}
.hjitem.done .acts{display:none}
.hjres b{display:block}
.hjitem.right .hjres b{color:var(--cyan)}
.hjitem.wrong .hjres b{color:var(--pink)}
.hjres p{margin:4px 0 0;font-size:14px}
.score{font:18px/1 var(--body);font-weight:700;color:var(--c)}
.tagline{display:block;color:var(--c);font-weight:700;font-size:12.5px;margin-bottom:4px}
.hooklv input{width:100%;max-width:420px;accent-color:var(--c);margin-bottom:10px}
.hooklv .card{margin-bottom:12px}
.stars{color:var(--yel);font-weight:700;margin:0 0 6px}
.formula-s{font-weight:700;color:var(--c)}
.chain{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.chain>div{background:var(--ink2);border:2px solid var(--line);border-radius:12px;padding:10px 14px;max-width:720px}
.chain>div span{font-weight:700;color:var(--c);font-size:13px}
.chain>div p{margin:2px 0 0;font-size:14.5px}
.chain>i{font-style:normal;color:var(--c);margin-left:20px}
.persona{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.pcell{flex:1;min-width:190px;display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--ink2);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;opacity:.5;transition:.2s}
.pcell.on{opacity:1;border-style:solid;border-color:var(--c)}
.pcell b{font:22px/1.2 var(--disp)}
.pcell small{font-size:13px;color:#D7D9F5}
.pcell em{font-style:normal;font-size:12.5px;color:var(--mute)}
.persona .x{align-self:center;font:30px/1 var(--disp);color:var(--c)}
.presult{flex:1;min-width:220px;background:var(--deep);border-radius:14px;padding:12px 14px;font-size:13.5px}
.presult b{display:block;font:22px/1.2 var(--disp);color:var(--cyan)}
.presult b.zero{color:var(--pink)}
.presult p{margin:4px 0 0}
.calc{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ink2);border:2px solid var(--c);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.calc label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:13.5px}
.calc input{width:160px;background:var(--deep);border:2px solid var(--line);border-radius:10px;color:var(--paper);font:22px/1.2 var(--disp);padding:6px 10px}
.eq{font:34px/1 var(--disp);color:var(--c)}
.cout{display:flex;gap:10px;flex-wrap:wrap}
.cout div{background:var(--deep);border-radius:10px;padding:6px 14px;font-size:13px;color:var(--mute)}
.cout b{display:block;font:28px/1.2 var(--disp);color:var(--paper)}
.flow{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:10px}
.flow>i{font-style:normal;color:var(--mute);flex:none}
.fnode{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--ink2);border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;min-width:84px}
.fnode span{font-size:12px;color:var(--mute);font-weight:700}
.fnode b{font:20px/1.2 var(--disp)}
.fnode em{font-style:normal;font-size:11px;font-weight:700;color:var(--yel);white-space:nowrap}
.fnode.on{border-color:var(--c);background:rgba(127,178,255,.16);transform:translateY(-3px)}
.gate{font-style:normal;font-size:13px;background:var(--yel);color:var(--ink);border-radius:999px;padding:1px 10px;margin-left:8px;vertical-align:middle}
#wf-out h4{margin:0 0 10px;font:22px/1.2 var(--disp)}
.wfgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.wfgrid p{margin:0}
.wfgrid .wide{grid-column:1/-1}
#wf-out{margin-bottom:12px}
.rule span{display:block;font-size:12px;color:var(--c);font-weight:700}
.rule b{font-size:15px}
.classic .learn{color:var(--cyan);font-weight:700}

/* ---------- 镜头 v2 ---------- */
.light-ov{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
.vf.bare .vf-screen{box-shadow:5px 5px 0 rgba(0,0,0,.35)}
.seq .seqline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.seqline span{background:var(--deep);border:1.5px solid var(--c);color:var(--c);border-radius:6px;padding:0 8px;font-size:13px;font-weight:700}
.seqline i{font-style:normal;color:var(--mute)}
.seq .btn{margin-top:10px}
.purpose{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.purpose div{display:flex;flex-direction:column;background:var(--ink2);border-radius:10px;padding:10px 12px;border-left:4px solid var(--c)}
.purpose span{font-size:13.5px;color:var(--mute)}
.move .code{margin-top:8px}
.move .btn,.move .mbtn{margin-top:8px;align-self:flex-start}
.move{display:flex;flex-direction:column}
.move b small{font-size:12px;color:var(--mute);font-weight:400;margin-left:6px}
.dur{background:var(--ink2);border:2px solid var(--line);border-radius:16px;padding:14px 18px}
.daxis{display:flex;justify-content:space-between;margin-left:110px;margin-right:230px;font-size:11.5px;color:var(--mute)}
.drow{display:grid;grid-template-columns:100px 1fr 70px 150px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.dtrack{position:relative;height:14px;background:var(--ink3);border-radius:7px}
.dtrack i{position:absolute;top:0;bottom:0;background:var(--c);border-radius:7px;box-shadow:0 0 10px rgba(63,230,208,.5)}
.drow span{font-weight:700;color:var(--c)}
.drow small{color:var(--mute);font-size:12.5px}
.rhy{display:flex;flex-direction:column}
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rh b{font:20px/1.2 var(--disp)}
.rh em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--c)}
.rbars{display:flex;gap:3px;height:26px;margin:10px 0 4px}
.rbars i{background:var(--ink3);border-radius:4px;transition:background .1s,transform .1s}
.rbars i.on{background:var(--c);transform:scaleY(1.25)}
.rhy .btn{align-self:flex-start;margin-top:8px}
.tl{margin-top:12px}
.tlbar{position:relative;display:flex;gap:3px;height:62px;margin-bottom:10px}
.tlbar button{min-width:0;border:0;border-radius:8px;background:var(--ink3);color:var(--mute);cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center}
.tlbar button b{font:18px/1.1 var(--disp)}
.tlbar button small{font-size:11.5px}
.tlbar button.on{background:var(--c);color:var(--ink)}
.playhead{position:absolute;top:-6px;bottom:-6px;left:0;width:3px;background:var(--pink);box-shadow:0 0 10px var(--pink);border-radius:2px;opacity:0;pointer-events:none}
.playhead.on{opacity:1}
.tl .card{margin-bottom:10px}
.stagegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.stg{background:var(--ink2);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stg svg{width:100%;max-width:130px;display:block;margin:0 auto 6px}
.stg b{display:block;font:20px/1.2 var(--disp)}
.stg small{color:var(--mute);font-size:12.5px}
.stg .bd{fill:var(--deep);stroke:var(--line);stroke-width:1.5}
.stg .cam{stroke:var(--yel);stroke-width:3;stroke-linecap:round}
.stg .p{fill:var(--cyan)}
.stg .p.main{fill:var(--pink)}
.stg .tbl{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-dasharray:3 3}
.stg .ar{stroke:var(--yel);stroke-width:2}
.formline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.formline span{background:var(--ink2);border:2px solid var(--c);border-radius:8px;padding:3px 10px;font-weight:700;font-size:14px}
.formline i{font-style:normal;color:var(--c);font-weight:700}
.badc{border-color:rgba(255,79,154,.45)}
.badc>b{color:#FFB3CF}

/* ---------- 提示词 v2 ---------- */
.builder{background:var(--ink2);border:2px solid var(--c);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start}
.brow>b,.bfield>b{font:18px/1.9 var(--disp)}
.brow .seg{margin:0}
.bfield{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center}
.bfield input{background:var(--deep);border:2px solid var(--line);border-radius:10px;color:var(--paper);font:inherit;font-size:14px;padding:8px 12px;width:100%}
.bfield input:focus{outline:none;border-color:var(--c)}
.bout{background:var(--deep);border-radius:12px;padding:14px;border-left:4px solid var(--c)}
.bout code{display:block;font-family:inherit;color:var(--yel);font-size:14.5px;line-height:1.7;margin-bottom:10px;word-break:break-word}
#v-prompt .seg button.on{background:var(--yel)}

/* ---------- 风格 v2 ---------- */
button.card.fam{cursor:pointer;display:flex;flex-direction:column;gap:6px}
button.card.fam:hover{border-color:var(--c)}
.fam code{font-family:inherit;font-size:12.5px;color:var(--c);background:var(--deep);border-radius:6px;padding:4px 8px}
#fam-chips{margin:16px 0 14px}
.famtag{position:absolute;left:12px;top:12px;background:rgba(18,18,58,.75);color:#fff}
.mini{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;margin-bottom:10px;border:2px solid rgba(255,255,255,.6)}
.mini svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mini i{position:absolute;inset:0;pointer-events:none}
.tone .code{margin-top:8px}
.knobs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.knobs span{background:var(--deep);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700;color:var(--paper)}
.knobs small{display:block;font-size:11px;font-weight:400;color:var(--mute)}
.exp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.exp .card{margin-top:4px}
.pal .sw{display:flex;height:54px;border-radius:10px;overflow:hidden;margin-bottom:10px;border:2px solid rgba(255,255,255,.5)}
.pal .sw i{flex:1}
.faceacts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
table.face td{padding:4px}
table.face button{width:100%;background:var(--deep);border:2px solid transparent;border-radius:8px;color:var(--mute);font-size:13px;padding:5px 6px;cursor:pointer;text-align:center}
table.face button:hover{color:var(--paper)}
table.face button.on{border-color:var(--c);color:var(--ink);background:var(--c);font-weight:700}
.faceout{margin-top:14px;background:var(--ink2);border:2px solid var(--c);border-radius:16px;padding:14px 18px}
.faceout>code{display:block;font-family:inherit;font-size:15px;color:var(--c);line-height:1.8;margin:4px 0 10px}
.idc dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.idc dt{color:var(--c);font-weight:700}
.idc dd{margin:0}
.idc .anchor{color:var(--yel);font-weight:700}
.lvl .lv{display:inline-block;font-size:12px;font-weight:700;background:var(--ink3);color:var(--mute);border-radius:999px;padding:0 10px;margin-bottom:6px}
.lvl .lv.hi{background:var(--pink);color:var(--ink)}
.pits{columns:2 260px;margin:0;padding-left:24px;font-size:15px}
.pits li{margin-bottom:8px;break-inside:avoid}
.pits li::marker{font-family:var(--disp);color:var(--c)}

/* ---------- 首页 v2 ---------- */
.pipeline-home{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin-top:6px}
.pipeline-home a{flex:1;min-width:150px;display:flex;flex-direction:column;gap:4px;text-decoration:none;background:var(--ink2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;transition:.2s}
.pipeline-home a:hover{border-color:var(--c);transform:translateY(-3px)}
.pipeline-home b{font:20px/1.2 var(--disp)}
.pipeline-home small{color:var(--mute);font-size:12.5px}
.pipeline-home .arr{align-self:center;font-style:normal;color:var(--mute);font-size:20px}
/* 修正 */
.grid2{grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr))}
.grid3{grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr))}
.purpose{grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr))}
.matrix td.m-a{color:var(--c)} .matrix td.m-b{color:var(--yel)} .matrix td.m-c{color:var(--org)} .matrix td.m-d{color:#5A5DA8} .matrix td.m-e{color:var(--vio);font-size:13px;font-weight:700}
.matrix thead th:not(:first-child){text-align:center}
.hj{grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.panel .row{max-width:72%}
.sec{margin-top:40px}
.daxis{margin-right:240px}
.brow .seg{justify-self:start}
table.face{table-layout:fixed}
table.face thead th:first-child{width:64px}

/* ================= v3 ================= */
.cap{font-size:12.5px;color:var(--mute);text-align:center;margin:8px 0 0}
.pmeta{margin-top:4px!important;font-size:12.5px!important;color:var(--c)!important;font-weight:700}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.quick button{display:flex;align-items:center;gap:8px;background:var(--ink2);border:2px solid var(--line);border-radius:999px;padding:5px 14px 5px 6px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.quick button:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:3px 3px 0 var(--c)}
.quick .stampmini{margin:0;width:22px;height:22px;font-size:14px}

/* 取景器：机位角度 */
.vf .scene{transition:filter .5s,transform .7s cubic-bezier(.3,1,.4,1);transform-origin:50% 50%}
.vf[data-angle=low] .scene{transform:perspective(700px) rotateX(14deg) scale(1.32);transform-origin:50% 100%}
.vf[data-angle=high] .scene{transform:perspective(700px) rotateX(-14deg) scale(1.32);transform-origin:50% 0}
.vf[data-angle=dutch] .scene{transform:rotate(-12deg) scale(1.38)}
.vf[data-angle=pov] .scene,.vf[data-angle=hand] .scene{animation:hand 2.6s ease-in-out infinite;transform:scale(1.08)}
.vf[data-angle=lowhand] .scene{animation:handlow 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes hand{0%,100%{transform:scale(1.08) translate(0,0) rotate(0)}25%{transform:scale(1.08) translate(-1%,.6%) rotate(-.6deg)}50%{transform:scale(1.08) translate(.8%,-.5%) rotate(.4deg)}75%{transform:scale(1.08) translate(-.4%,.8%) rotate(-.3deg)}}
@keyframes handlow{0%,100%{transform:perspective(700px) rotateX(12deg) scale(1.3) translate(0,0)}33%{transform:perspective(700px) rotateX(12deg) scale(1.3) translate(-1%,.5%) rotate(-.5deg)}66%{transform:perspective(700px) rotateX(12deg) scale(1.3) translate(.8%,-.4%) rotate(.4deg)}}
.ang-ov{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
.ang-ov svg{position:absolute;display:block}
.ang-ov.bird svg{inset:0;width:100%;height:100%}
.ang-ov.ots svg{left:-4%;bottom:0;height:78%;width:auto}
.ang-ov.pov{background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.75))}
.vf[data-angle=bird] .ang-ov.bird,.vf[data-angle=ots] .ang-ov.ots,.vf[data-angle=pov] .ang-ov.pov{opacity:1}
.vf.vert .ang-ov.ots svg{left:-30%;height:60%}

/* 并排的“取景器 + 内容” */
.sidewrap{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:18px;align-items:start}
.sidevf{position:sticky;top:calc(var(--hh) + 64px)}
.sidevf .vf.vert .vf-screen{width:100%}
.sidewrap.tw{margin:14px 0}
.rhygrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.genre.on{border-color:var(--c);box-shadow:4px 4px 0 var(--c)}
.genre .btn{margin-top:10px}

/* 病例里的演示 */
.demo{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;background:var(--deep);border-radius:12px;padding:12px}
.demo .vf.vert .vf-screen{width:100%;border-width:2px;box-shadow:none}
.demo .hud{font-size:9px}.demo .hud .hs{font-size:12px}
.demo h4{color:var(--pink);margin:0 0 4px}

/* 站位 */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:18px;align-items:start}
.plan{position:relative;aspect-ratio:1/1;max-width:360px;margin:0 auto;background:#0B0B28;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.plan-bg{position:absolute;inset:0;width:100%;height:100%}
.plan-bg line{stroke:rgba(255,255,255,.06);stroke-width:.4}
.plan-bg .fr{fill:rgba(255,216,74,.07);stroke:rgba(255,216,74,.45);stroke-width:.5;stroke-dasharray:2 2}
.pcam{position:absolute;left:50%;top:94%;width:34px;transform:translate(-50%,-50%)}
.pcam .cb{fill:var(--yel)}.pcam .cl{fill:#C9A92E}.pcam .rec{fill:#ff3b3b}
.tok{position:absolute;width:13%;transform:translate(-50%,-50%);transition:left .8s cubic-bezier(.4,1.3,.5,1),top .8s cubic-bezier(.4,1.3,.5,1),opacity .4s;text-align:center}
.tok svg{width:100%;display:block}
.tok .tr{transition:transform .6s}
.tok b{display:block;font-size:11px;color:var(--pc);margin-top:-2px}
.ptable{position:absolute;left:50%;top:44%;width:34%;height:22%;transform:translate(-50%,-50%);border:2px dashed var(--mute);border-radius:50%;opacity:0;transition:opacity .4s}
.ptable.on{opacity:.7}
.front{position:relative;aspect-ratio:16/9;border:3px solid var(--paper);border-radius:12px;overflow:hidden;box-shadow:6px 6px 0 rgba(0,0,0,.35)}
.fbg{position:absolute;inset:0;background:linear-gradient(#2A2168 0 52%,#3B2E80 52% 53%,#1A1646 53% 100%)}
.fbg::before{content:"";position:absolute;left:62%;top:12%;width:18%;height:28%;border:4px solid #3F3490;background:linear-gradient(#FF9ECF55,#5B2A7A55)}
.fbg::after{content:"";position:absolute;inset:53% 0 0;background:repeating-linear-gradient(90deg,transparent 0 12%,rgba(255,255,255,.04) 12% 12.4%)}
.fig{position:absolute;aspect-ratio:1/2;transform:translateX(-50%);transition:left .8s cubic-bezier(.4,1.3,.5,1),bottom .8s cubic-bezier(.4,1.3,.5,1),height .8s cubic-bezier(.4,1.3,.5,1),opacity .4s}
.fig svg{width:100%;height:100%;display:block;overflow:visible}
.fig .fv{display:none}
.fig[data-face=front] .fv.front,.fig[data-face=back] .fv.back,.fig[data-face=right] .fv.right,.fig[data-face=left] .fv.right{display:inline}
.fig[data-face=left] svg{transform:scaleX(-1)}
.ftable{position:absolute;left:50%;bottom:24%;width:30%;height:9%;transform:translateX(-50%);background:#5B3A2A;border-radius:6px;box-shadow:0 6px 0 #3A2418;z-index:50;opacity:0;transition:opacity .4s}
.ftable.on{opacity:1}
.fhud{position:absolute;left:10px;top:8px;font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.4);padding:1px 8px;border-radius:4px;z-index:120}
.stg-ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 10px}

/* 机位角度 */
.angle{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start;margin-bottom:12px}
.aside svg{width:100%;display:block;background:#0B0B28;border:2px solid var(--line);border-radius:14px}
.aside .gnd{stroke:var(--line);stroke-width:2}

promptCats: ['剧本','分镜','角色','场景','光影','视频','精修','配音'],
prompts: [
  { cat:'剧本', title:'小说段落 → 漫剧剧本', use:'把原文改成可生图、可配音的分格剧本。',
    template:'把下面这段小说改写成AI漫剧剧本：\n[[原文|在这里粘贴小说段落]]\n要求：\n1. 删掉心理描写、环境渲染和旁白说教，情绪必须外化成动作或克制的旁白；\n2. 按【场景】【旁白】【台词】【画面】分格；\n3. 旁白每句不超过20字，口语化；\n4. 每30–45秒一个爆点；\n5. 结尾留一句悬念；\n6. 【场景】写清：地点+时间+光线+人物状态。' },
  { cat:'剧本', title:'生成爆款开头（三版）', use:'第1集开场不够抓人时用。',
    template:'根据下面的设定，写三版第1集开头：\n[[设定|女主曾是公司创始人，三年后以普通员工身份回归]]\nA 身份揭露型：所有人以为她是X，其实她是Y；\nB 降维打击型：对方以为我是软柿子，然后发现我是核武器；\nC 极限反转型：以为到了最惨，才发现只是开始。\n每版不超过100字，最后分析三版的优劣。' },
  { cat:'剧本', title:'优化口播句', use:'旁白太长、太书面时逐句改。',

  { cat:'剧本', title:'生成悬念收尾（三风格）', use:'每集结尾卡点。',
    template:'本集内容：[[本集内容|女主查到害死母亲的凶手竟是现在的老板]]\n结尾状态：[[结尾状态|她站在老板办公室门口]]\n下集开场：[[下集开场|老板主动约她吃饭]]\n请分别用情绪型、悬疑型、反转预告型各写一句结尾钩，每句不超过25字，不解答，留白。' },

    template:'追加要求：禁止心理活动描述，情绪必须外化；避免“霸道总裁”“命中注定”“一见钟情”等俗套；多个版本请使用不同的叙事角度。' },
  { cat:'剧本', title:'剧本素材提取（角色/场景/道具）', use:'剧本定稿后，一次性盘点所有需要生成的资产。',
    template:'请你仔细阅读剧本，提取盘点剧本中所有的角色、配角、路人、场景（室内/室外/不同空间）、道具，分别汇总到不同表格内。\n① 角色汇总：相同角色、配角、路人、出场集数、角色设计（性别·年龄身高体型发型发色脸型眼睛瞳孔肤色服装饰品性格·并优化为精准文生图描述词）\n② 场景汇总：相同场景（包括同场景下的不同空间），出场集数、场景设计（时间天气光源空间类型尺度高度主体前景氛围风格景别视角·并优化为精准文生图描述词）\n③ 道具汇总：相同道具（包括不同阶段的变化），出场集数及精准文生图描述词\n注意：不要丢失每一个细节。\n剧本：[[剧本|在这里粘贴剧本]]' },
  { cat:'分镜', title:'故事板框架', use:'把故事交给 AI 自动拆成连续分镜。',
    template:'【核心目标】人物一致性 / 场景一致性 / 分镜连续性。\n【项目基础设定】项目名称：[[项目名称|当归]]；项目类型：[[项目类型|年代悬疑]]；视频时长：[[时长|12秒]]；镜头数量：[[镜头数|6]]；整体风格：[[风格|旧照写实]]；核心情绪：[[情绪|悬念]]；色彩方案：[[色彩|茶褐主调]]；环境设定：[[环境|民国当铺内堂，黄昏]]；镜头叙事方式：[[叙事方式|无对白，靠动作推进]]。\n【人物设定】年龄、外貌、发型、服装、职业、性格、气质、固定道具、材质。\n【场景设定】主场景空间结构、环境元素、光线方向、时间天气、色调、固定物件。\n【核心分镜要求】自动拆连续分镜，每镜写镜号、秒数、景别、运镜、画面、情绪、音效、配乐。\n【画面限制】人物/场景/色调一致；文字放画面下方；不要乱码、脸崩、动作断裂、低清晰度。' },
  { cat:'分镜', title:'12 秒分镜脚本生成器', use:'把一段文案改写成 1 组固定 12 秒的镜头组。',
    template:'你是短剧分镜脚本生成器，把【输入文案】改写成1组固定12秒分镜。\n规则：\n①只基于原文，禁止添加人物/动作/场景/道具/心理；\n②接住前后分镜；\n③只写观众能看到的，心理改成表情/眼神/呼吸/手部动作/停顿；\n④映射：命中名称或别名统一输出标准名称，有锚点写“名称@图片N”；\n⑤总时长=12秒，转场用甩镜/定格/转黑/转白；\n⑥对白≤4句、单句≤10字、不改原词；\n⑦每镜写：对准谁/哪里/表情/主体动作/连带反应/关键信息/镜头位置与运动/光线。\n输出加 (no srt，no music)。\n【输入文案】[[输入文案|黄昏，一个女人把一枚旧怀表推到当铺柜台上要当。年轻掌柜拿起表，翻开表盖，看见里面刻的字，手一顿，抬眼看她。]]' },
  { cat:'分镜', title:'首尾帧（递信）', use:'递、转身、开门这类动作，用首尾帧补中间。',
    template:'首帧：[[首帧|女主侧身站立，右手伸出，一封米黄旧信在她指间，近中景，暖黄灯光，写实风格。]]\n尾帧：同一机位同一人物同服装，[[尾帧变化|信已递到对方手中，两人手指刚接触]]，其余不变。\n过渡提示：动作自然连贯，手部无变形，人物外貌服装保持一致，光线不变。' },
  { cat:'分镜', title:'一镜三写：生图平台（MJ / SD）', use:'纯生图，英文+参数，不写运镜和时长。',
    template:'[[画面|a woman turning back in the rain]], medium shot, backlighting rim light, cold blue with warm streetlight, shallow depth of field, cinematic --ar 16:9' },
  { cat:'分镜', title:'一镜三写：图生视频（即梦 / 可灵）', use:'上传静帧当首帧，中文自然语言，必须写运镜、时长和情绪走向。',
    template:'（上传静帧）[[动作|女主在雨中缓缓回头]]，镜头[[运镜|缓慢推近]]，雨丝清晰，发丝微动，情绪从[[情绪起点|迟疑]]到[[情绪终点|坚定]]。运镜：推近，[[时长|3–4s]]，16:9' },
  { cat:'分镜', title:'站位套用（面对面）', use:'双人对话/冲突戏。换成并排、围绕等同理。',

  { cat:'角色', title:'角色卡·四宫格', use:'建角色资产，全剧反复引用。角色卡只写人。',
    template:'[[时代世界观|民国]]·[[身份|晋昌当年轻掌柜]]·[[性别年龄|男·26岁]]·[[全局风格|旧照写实]]。\n面容：[[面容锚点|窄长脸，剑眉略平，眼型狭长内双眼尾微垂，鼻梁高直，薄唇嘴角自然下压，下颌利落颧骨中等，肤色暖白偏冷，左眉尾浅旧疤]]。\n发式：[[发式|民国偏分油背头，墨黑，鬓角修净]]。\n服装：[[服装六层|内月白立领衬衫/中靛青长衫袖口磨旧/外深灰薄呢马甲缀铜纽/腰黑皮带挂黄铜怀表链/下同色西裤/足旧牛津皮鞋]]。\n姿态：双手自然下垂，站姿自然，面容平静。\n四宫格：白底，正面/背面/侧身90°/面部特写。\n画质：真人写实，保留皮肤毛孔细纹，8K，禁塑料CG。' },
  { cat:'角色', title:'21:9 超宽角色设定卡（真人）', use:'一张图锁定面部特写、三视图和表情。需要参考图垫图。',

/* ============================ 概念词典 ============================ */
concepts: [
  { cat:'剧本', term:'套路', def:'一整类故事的底层框架，决定整部剧大方向。', ex:'重生复仇、先婚后爱' },
  { cat:'剧本', term:'桥段', def:'能插进任何故事的标准场景/情节零件。', ex:'当众打脸、身份揭露' },
  { cat:'剧本', term:'梗', def:'一看就懂、约定俗成的设定。', ex:'扮猪吃老虎、马甲掉了' },
  { cat:'剧本', term:'金手指', def:'主角的外挂，能力差的来源。', ex:'系统、重生记忆、血脉' },
  { cat:'剧本', term:'爽点 / 虐点', def:'爽到 / 揪心的瞬间。虐是为爽蓄力，爽点必须先有虐点垫底。', ex:'主角被冤枉（虐）→ 反派下跪（爽）' },
  { cat:'剧本', term:'爽感闭环', def:'先虐（憋）再爽（放）的快感节奏：憋 → 憋 → 憋 → 爆。爽点强度 = 憋屈深度 × 反转速度。', ex:'被欺负 → 反手打回去' },
  { cat:'剧本', term:'扮猪吃老虎', def:'隐藏真实实力或身份，等对手放松警惕再一击揭底。', ex:'隐去继承人身份先当普通员工' },
  { cat:'剧本', term:'马甲', def:'主角隐藏的多重身份，一集揭一个当卡点。', ex:'第3集揭露她是设计师“L”，第6集揭露她是大股东' },
  { cat:'剧本', term:'火葬场', def:'伤害主角的人得知真相后追悔，开始反追。', ex:'追妻火葬场' },
  { cat:'剧本', term:'黄金3秒', def:'开头3秒决定观众是否划走。第1集直接进最高张力现场，零背景。', ex:'离婚现场、被扇耳光、下跪' },
  { cat:'剧本', term:'钩子', def:'被制造出来的“信息缺口”。本质是抛出问题，延迟回答。', ex:'“他打开那扇门——里面的东西，让他浑身发冷。”' },
  { cat:'剧本', term:'蔡格尼克效应', def:'人对“未完成的事”记得更牢、更放不下。这是钩子有效的心理学依据。', ex:'每集卡在关键处，你一整天都惦记' },
  { cat:'剧本', term:'信息差', def:'人一旦意识到“有个答案我不知道”，就会本能地想补上缺口；也指观众知道而角色不知道的信息。', ex:'观众知道他是谁，朝堂上下都不知道' },
  { cat:'剧本', term:'卡点', def:'每集结尾卡在“高潮刚起、答案未揭”的位置，驱动追更；付费卡点放在悬念最强处。', ex:'他颤抖着接起那通电话……（黑屏）' },
  { cat:'剧本', term:'四段式', def:'单集骨架：开场钩（0–15s）→ 发展（15–90s）→ 高潮（90–105s）→ 收尾钩（105–120s）。', ex:'第1集《五万块》' },
  { cat:'剧本', term:'起承转合', def:'四幕全剧骨架，管整部60集的走向。三幕（建立/升级/爆发）是它的简化切法。', ex:'净身出户 → 三次受挫 → 身份揭露 → 打脸收场' },
  { cat:'剧本', term:'三次期待被打破', def:'“承”这一幕的核心手法：让观众三次以为要好起来，结果每次都更糟，之后再爆发。', ex:'证据被毁 → 董事倒戈 → 盟友是反派的人' },
  { cat:'剧本', term:'人物弧光', def:'缺陷（起点）→ 激励事件 → 3–5个标志性行动 → 克服缺陷（呼应开头）。', ex:'从“不敢信任任何人”到“学会信任真正对她好的人”' },
  { cat:'剧本', term:'心理缺陷', def:'驱动人物行为选择的内心症结，不是处境。“不会武功”“家里穷”是处境。', ex:'因幼时被背叛，她无法再信任任何人' },
  { cat:'剧本', term:'远端目标', def:'整部剧要达成的深层追求，必须和心理缺陷挂钩，给故事灵魂。', ex:'从只敢靠自己，成长为敢再次信任一个人' },
  { cat:'剧本', term:'磨刀石反派', def:'反派越强越可恨，主角战胜时越爽。动机清晰、够狠、死挡主角远端目标。', ex:'渣男、幕后黑手' },
  { cat:'剧本', term:'口播优先', def:'短漫剧是“用耳朵看的剧”：旁白每句≤20字、口语化、关键词放句首句末、有停顿。', ex:'“她没说话。三年的委屈，一下子涌上来。”' },
  { cat:'剧本', term:'三删三留', def:'删心理描写、环境渲染、旁白说教；留对话冲突、行为动作、情绪爆发。', ex:'“她很紧张” → 特写：手指反复摩挲杯壁' },
  { cat:'剧本', term:'节奏压缩公式', def:'一集 ≈ 2分钟 ≈ 50张图 ≈ 600字口播 ≈ 2000字原文。', ex:'1万字原文 ≈ 5集' },
  { cat:'剧本', term:'检查门', def:'AI 工作流步与步之间的质量闸门：门C（人设后）、门D（大纲后，最关键）、10项质检（正文后）。', ex:'大纲有问题必须在门D改好' },

  { cat:'分镜', term:'12秒镜头组', def:'短剧的最小叙事单元：锁死12秒、限制对白（≤4句，单句≤10字），逼你把信息交给画面和道具特写。', ex:'《当归》6镜脚本' },

  { cat:'剧本', term:'男频 / 女频', def:'按目标观众划分的两大类型。男频核心情绪是变强、逆袭、掌控；女频核心情绪是被爱、被认可、扬眉吐气。两者节奏不能混用。', ex:'女频情感故事硬塞男频“无脑碾压”节奏，两头不讨好', go:['script','s-trope'] },
  { cat:'剧本', term:'打脸', def:'反派当众踩主角，主角亮出身份或实力，反派脸色骤变。每集一小打脸，全剧一大打脸。', ex:'“就你也配？”——她掏出收购全公司的文件', go:['script','s-trope'] },
  { cat:'剧本', term:'龙傲天', def:'男频经典套路：能力差被低估后爆发。揭底要往后拖，太早暴露实力就没戏了。', ex:'', go:['script','s-trope'] },
  { cat:'剧本', term:'战神归来 / 赘婿', def:'隐忍后身份揭露的套路。一幕使劲虐，三幕使劲爆；忍要有止损线，忍到弃剧就失败了。', ex:'' },
  { cat:'剧本', term:'系统流 / 签到流', def:'主角获得“系统”外挂，即时反馈带来爽感。系统不能太万能，每个奖励都要配一个冲突。', ex:'系统提示做成醒目的文字弹窗' },
  { cat:'剧本', term:'重生 / 穿越流', def:'带着未来记忆或另一个世界的见识，用信息差降维打击。重生第 1 集就要立刻预知打脸，别花几集回忆。', ex:'' },
  { cat:'剧本', term:'神豪流', def:'财富碾压的套路，豪车别墅现金很适合 AI 生图。钱必须是打脸工具，只炫富没有冲突会腻。', ex:'' },
  { cat:'剧本', term:'先婚后爱', def:'女频套路：从不被爱到被独宠。先冷、先误会，才甜；一见面就甜没有张力。', ex:'契约婚姻' },
  { cat:'剧本', term:'替身 / 白月光', def:'主角被当成别人的替身，委屈错位制造虐感，真相揭开时释放。误会不能拖太久，该炸就炸。', ex:'' },
  { cat:'剧本', term:'团宠', def:'主角被全世界偏爱，提供极致的安全感。每份宠爱都要有理由，宠得没理由就假。', ex:'强者的反差萌' },
  { cat:'剧本', term:'破镜重圆', def:'重逢或落难逆袭的套路，常用时间跳跃和身份反差，开场钩特别好写。', ex:'破产千金' },
  { cat:'剧本', term:'降维打击', def:'对方以为我是软柿子，然后发现我是核武器。来源通常是信息差或能力差。', ex:'开场三公式之一' },
  { cat:'剧本', term:'反转', def:'情节 180° 改变方向，让观众“意料之外、情理之中”。靠埋伏笔、藏底牌做出来。', ex:'', go:['script','s-struct'] },
  { cat:'剧本', term:'伏笔', def:'前面埋下、后面揭开的悬念、道具或人物。埋下的每个钩，结局前都要一一回收。', ex:'剑柄红绳系碎玉，来历成谜，贯穿全剧' },
  { cat:'剧本', term:'组合公式', def:'主套路（大方向）+ 反差设定（制造张力）+ 新颖外壳（差异化）。一个主套路，最多再叠 1–2 个。', ex:'重生复仇 × 马甲文', go:['script','s-trope'] },
  { cat:'剧本', term:'新颖外壳', def:'套路不变，换一个别人没用过的题材、身份或场景。创新不在套路本身，而在外壳、细节和组合方式。', ex:'同一个“当众打脸”，都市/古装/校园三种写法' },
  { cat:'剧本', term:'蓝海 / 红海', def:'差异化自检：去抖音搜同类，0–2 个账号在做是蓝海，5 个以上在跑量是红海。', ex:'' },
  { cat:'剧本', term:'激励事件', def:'逼主角不得不改变的事件，确立当前目标，是弧光的第二步。', ex:'离婚当天，律师告知她是唯一继承人' },
  { cat:'剧本', term:'当前目标', def:'眼前要解决的具体事，推动剧情往前走。只有当前目标，故事会很薄。', ex:'拿回被夺走的公司' },
  { cat:'剧本', term:'黄金人设公式', def:'爆款主角 = 身份差 × 能力差 × 情感钩。三者是乘法：缺一个，人物就“扁”。', ex:'', go:['script','s-char'] },
  { cat:'剧本', term:'身份差', def:'表面身份和真实身份之间的巨大反差，制造“你不知道我多厉害”的张力。', ex:'保洁工 → 隐退 CEO' },
  { cat:'剧本', term:'能力差', def:'超越当前环境的隐藏能力：观众知道，反派不知道，全程有爽感预期。', ex:'重生知未来、系统外挂' },
  { cat:'剧本', term:'情感钩', def:'让观众心疼、认同、愿意陪主角走下去的情感动机。', ex:'为家人忍辱；被信任的人背叛要复仇' },
  { cat:'剧本', term:'配角功能位', def:'每个配角都要有功能：导师、情敌、技术支援、价值观冲击者、磨刀石反派、气氛组。答不上功能就合并或删掉。', ex:'', go:['script','s-char'] },
  { cat:'剧本', term:'开场钩', def:'黄金 3 秒 / 15 秒里的钩子。第 1 集直接进最高张力现场，零背景，背景后续用对话带出。', ex:'离婚推卡“拿着，别烦我”', go:['script','s-hook'] },
  { cat:'剧本', term:'段落钩', def:'一集中段每 30–45 秒一个小钩：新信息、冲突升级、小反转、狠台词。让观众看完这一集。', ex:'', go:['script','s-hook'] },
  { cat:'剧本', term:'结尾钩 / 连接钩', def:'结尾 = 一个问题；下集开头 = 半个回答 + 一个新问题。风格有情绪型、悬疑型、反转预告型。', ex:'', go:['script','s-hook'] },
  { cat:'剧本', term:'开场三公式', def:'身份揭露型（所有人以为她是 X，其实她是 Y）、降维打击型、极限反转型（以为到了最惨，才发现只是开始）。可以叠用。', ex:'', go:['script','s-hook'] },
  { cat:'剧本', term:'四类标注', def:'AI 漫剧剧本的四种行：【场景】供 AI 生图，【旁白】配音播出，【台词】角色说的话，【画面】构图景别指令。', ex:'', go:['script','s-format'] },
  { cat:'剧本', term:'废行', def:'既不能生图、也不能当旁白念、也不是台词、也不是构图指令的一行字。删掉。', ex:'“命运有时候就是这么残忍”' },
  { cat:'剧本', term:'心理外化', def:'把画不出、念不出的内心活动，翻译成看得见的动作或克制的旁白。', ex:'“她很紧张” → 特写：手指反复摩挲杯壁' },
  { cat:'剧本', term:'情绪节点', def:'憋、爽、反转这样的高情绪瞬间。一集精选 5–8 个，每 1000 字原文至少 1 个可视化情绪高潮。', ex:'', go:['script','s-ep'] },
  { cat:'剧本', term:'剧情说明书', def:'AI 工作流 1.2 的产出，相当于剧本的“产品需求文档”：剧名、体量、类型、看点、梗概五要素。', ex:'', go:['script','s-flow'] },
  { cat:'剧本', term:'分集细纲', def:'把四幕大纲拆成 60 集。前 12 集逐集详写（矛盾 + 情绪节点 + 结尾钩），13–60 集按板块略写。', ex:'', go:['script','s-flow'] },
  { cat:'剧本', term:'本集定位分析', def:'关键集扩写前，先把全剧大纲喂给 AI，让它说清前情、本集核心任务和要埋的伏笔，确认后再写。', ex:'AI 工作流 1.6 一致性扩写' },
  /* 分镜 */
  { cat:'分镜', term:'景别', def:'镜头离人物多远、看多大范围：远景、全景、中景、近景、特写、大特写。情绪越强越推近。', ex:'', go:['shot','h-vf'] },
  { cat:'分镜', term:'远景', def:'环境全貌，人很小。用于建立镜头、交代时空；大远景表现渺小、孤独、宿命感。', ex:'建议 0.8–1.5 秒', go:['shot','h-vf'] },
  { cat:'分镜', term:'全景', def:'全身 + 环境，交代动作以及人物和环境的关系。', ex:'', go:['shot','h-vf'] },
  { cat:'分镜', term:'中景', def:'腰部以上，交代关系和冲突站位，是对话戏的骨架。全片只用中景会像有声漫画。', ex:'', go:['shot','h-vf'] },
  { cat:'分镜', term:'近景', def:'胸部以上，看清表情，表现台词和情绪。', ex:'建议 1–1.5 秒', go:['shot','h-vf'] },
  { cat:'分镜', term:'特写', def:'面部占满画面，放大情绪。情绪弱时不要硬怼脸。', ex:'建议 0.5–1 秒', go:['shot','h-vf'] },
  { cat:'分镜', term:'大特写', def:'极致局部：眼睛、一滴泪、道具上的关键字。常卡在情绪峰值定格，做反转钩子。', ex:'盖内“归”字填满画面', go:['shot','h-vf'] },
  { cat:'分镜', term:'机位角度', def:'摄像机相对人物的高度和方向：平视、仰拍、俯拍、鸟瞰、荷兰角、过肩、主观视角。', ex:'', go:['shot','h-angle'] },
  { cat:'分镜', term:'仰拍', def:'从下往上拍，人物显强大、有压迫感。强弱关系里仰拍强者。', ex:'身份揭露 → 仰视 + 逆光剪影', go:['shot','h-angle'] },
  { cat:'分镜', term:'俯拍', def:'从上往下拍，人物显渺小、被碾压。强弱关系里俯拍弱者。', ex:'表现无助 → 俯视 + 远景', go:['shot','h-angle'] },
  { cat:'分镜', term:'鸟瞰', def:'从正上方往下拍，人物缩成小点，有监视感、宏观感、孤独感。', ex:'', go:['shot','h-angle'] },
  { cat:'分镜', term:'荷兰角', def:'画面倾斜，制造不安、失衡和疯狂感。', ex:'dutch angle', go:['shot','h-angle'] },
  { cat:'分镜', term:'过肩镜头（OTS）', def:'越过一个人的肩膀拍另一个人。对白对峙常用过肩 + 反打。', ex:'', go:['shot','h-angle'] },
  { cat:'分镜', term:'主观视角（POV）', def:'从角色眼睛看出去，第一人称代入，也能制造悬念。', ex:'', go:['shot','h-angle'] },
  { cat:'分镜', term:'构图', def:'分镜的骨架，决定画面元素怎么摆、观众视线往哪走。景别管“离多远”，构图管“放哪里”。', ex:'三分法、对称、引导线、框架、留白', go:['shot','h-vf'] },
  { cat:'分镜', term:'三分法', def:'主体放在三分线交点，自然有呼吸感，是新手的保底构图。', ex:'', go:['shot','h-vf'] },
  { cat:'分镜', term:'引导线', def:'用走廊、道路等线条制造纵深，把视线引向主体。', ex:'', go:['shot','h-vf'] },
  { cat:'分镜', term:'框架构图', def:'用门窗等前景框住主体，制造窥视感、困住感。', ex:'悬疑版“门框框住她”', go:['shot','h-vf'] },
  { cat:'分镜', term:'留白', def:'主体很小，处在大片空旷环境里，用尺度反差讲孤独。', ex:'', go:['shot','h-vf'] },
  { cat:'分镜', term:'站位', def:'多人画面里谁在左、谁在右、谁在前、谁在后。站位是多人构图的第一约束：先站对，再互动。', ex:'并排、面对面、三角、前后、对立、围绕', go:['shot','h-stage'] },
  { cat:'分镜', term:'运镜', def:'摄像机怎么动：推、拉、摇、移/跟、环绕、升降。视频提示词必须写清运镜和时长。', ex:'', go:['shot','h-move'] },
  { cat:'分镜', term:'推 / 拉', def:'推是镜头向主体靠近，收拢情绪，越慢越克制；拉是远离主体，表现释放、孤独，常用于收尾。', ex:'slow dolly in / dolly out', go:['shot','h-move'] },
  { cat:'分镜', term:'摇', def:'机身不动，镜头转向。横摇扫视环境，纵摇从脚摇到脸让角色登场。', ex:'pan / tilt', go:['shot','h-move'] },
  { cat:'分镜', term:'跟移', def:'摄像机跟着人物移动，跟随感强，带纪实和紧张感。', ex:'tracking / follow shot', go:['shot','h-move'] },
  { cat:'分镜', term:'环绕', def:'摄像机绕人物转，带仪式感，常用在情绪峰值。', ex:'orbit，可写“绕人物 120°”' },
  { cat:'分镜', term:'升降', def:'摄像机上升或下降。升 = 希望、宏大；降 = 压迫、沉沦。', ex:'crane up / crane down', go:['shot','h-move'] },
  { cat:'分镜', term:'手持', def:'模拟手持拍摄的轻微晃动，制造不安、紧张、纪实感。', ex:'都市悬疑的默认运镜' },
  { cat:'分镜', term:'空镜', def:'没有人物的景物镜头，用来留白、交代时间流逝、情绪缓冲或转场。', ex:'建议 1–2 秒' },
  { cat:'分镜', term:'反应镜头', def:'给听者、旁观者的表情镜头。信息出来后停在反应上，才有冲击力。', ex:'由信息到反应：先道具特写，再人物反应' },
  { cat:'分镜', term:'插入镜头', def:'插在两个镜头之间的手部、道具特写等，可以遮掉坏动作的中段，也是后期补救手段。', ex:'' },
  { cat:'分镜', term:'越轴 / 跳轴', def:'摄像机越过两人连线，屏幕左右关系突然对调，观众方向感错乱。', ex:'确实要过轴，插一个中性镜头', go:['diag','dx-C03'] },
  { cat:'分镜', term:'镜头组接', def:'镜头怎么接，就是最基本的蒙太奇。三条基本功：节奏平衡、视线/动作匹配、由信息到反应。', ex:'', go:['shot','h-cut'] },
  { cat:'分镜', term:'蒙太奇', def:'通过镜头组接引导观众的联想。观众“看到什么、想到什么”，是被剪辑连起来的。', ex:'交叉剪切、叠印联想', go:['shot','h-cut'] },
  { cat:'分镜', term:'交叉剪切', def:'两条线索交替剪接，双线并进，制造紧张与悬疑。', ex:'' },
  { cat:'分镜', term:'转场', def:'场景或段落之间的衔接方式：甩镜、定格、转黑、转白。篇章切换常用转黑白。', ex:'' },
  { cat:'分镜', term:'景别序列', def:'用一串景别讲一场戏。常规开场全 → 中 → 近；情绪爆点中 → 近 → 大特写；反转揭示特写 → 全。', ex:'', go:['shot','h-seq'] },
  { cat:'分镜', term:'八类戏节奏', def:'心动慢、对峙前慢后快、反转铺垫稳反应停、悬疑前慢、惊悚前慢惊吓极快、喜剧包袱后停顿、线索前 3 秒讲重点、动作先交代空间再快切。', ex:'', go:['shot','h-rhythm'] },
  { cat:'分镜', term:'切镜原则', def:'什么时候换镜头：情绪转变、复杂动作、人物变化、空间转场、时间跳跃、对话乒乓、摄影机变化、特效独占。', ex:'', go:['shot','h-cut'] },
  { cat:'分镜', term:'部位库', def:'让镜头不虚的身体部位清单。情绪看眼睛泪光喉结，紧张看指节攥衣角，压迫看手掐下巴，证据看手机屏日记。', ex:'', go:['shot','h-12'] },
  /* 光影 */
  { cat:'光影', term:'光线方向', def:'光影的骨架：正面光、逆光、侧光、顶光、底光。全集先定死一个光源方向，否则合成 100% 穿帮。', ex:'', go:['shot','h-vf'] },
  { cat:'光影', term:'正面光（顺光）', def:'几乎无阴影，色彩饱和，五官偏扁平，有商业感。', ex:'Front lighting, flat illumination' },
  { cat:'光影', term:'逆光', def:'光从主体背后来，正面变暗或成剪影，边缘一圈轮廓光。适合相遇、离别、情绪高潮。', ex:'注意别把脸吃掉', go:['diag','dx-L02'] },
  { cat:'光影', term:'侧光', def:'光从 90° 方向来，一半亮一半暗，立体感强，暗示矛盾和内心挣扎。', ex:'split lighting' },
  { cat:'光影', term:'顶光', def:'眼窝、鼻下有浓黑阴影，阴郁、压迫、不可接近。', ex:'《教父》：看不清眼睛，却看清深不可测' },
  { cat:'光影', term:'底光', def:'光从下往上，阴影颠倒，产生非人的恐怖感，用于悬疑、恐惧。', ex:'' },
  { cat:'光影', term:'散射光（柔光）', def:'无明显方向，均匀照明，柔和无阴影，适合平静的日常。', ex:'阴天、室内' },
  { cat:'光影', term:'硬光 / 柔光', def:'光质的两种：硬光阴影边缘锐利、对比强；柔光过渡柔和。在方向光之上叠加光质。', ex:'' },
  { cat:'光影', term:'伦勃朗光', def:'经典人像布光，脸颊暗部出现一块三角形亮区，庄重、有质感。', ex:'Rembrandt lighting' },
  { cat:'光影', term:'轮廓光', def:'勾出人物边缘的一圈亮光，把人物从背景里分离出来。', ex:'rim light' },
  { cat:'光影', term:'体积光 / 丁达尔光', def:'光穿过雾、烟、尘形成可见的光柱，带来神圣感、电影感。', ex:'volumetric lighting, god rays' },
  { cat:'光影', term:'色温', def:'光的冷暖。低色温偏暖橙，温暖亲密；高色温偏冷蓝，清冷疏离。同场景色温要冻结。', ex:'' },
  { cat:'光影', term:'黄金时刻', def:'日出后、日落前的暖金色低角度光，浪漫、怀旧。', ex:'浪漫配方：黄金时刻逆光 + 柔光补光 + 光晕' },
  { cat:'光影', term:'情绪光影配方', def:'情绪 = 颜色 × 方向。孤独、悬疑、希望、浪漫、冲突各有一套光的配方，可以直接贴在画面描述后面。', ex:'', go:['prompt','p-mood'] },
  { cat:'光影', term:'色板', def:'全片的主色、辅助色、禁用色。和主光一起属于五大必锁资产。', ex:'', go:['diag','d-lock'] },
  { cat:'光影', term:'景深', def:'画面中清晰的范围。深景深交代空间；浅景深突出主体、背景虚化。', ex:'shallow depth of field, f/1.4' },
  /* 生图 */
  { cat:'生图', term:'场景五要素', def:'光线、色调、景深、细节密度、视角。每个要素都是可控变量，光线最重要。', ex:'', go:['style','y-tone'] },

function risk(){
  const val=[0,1,2].map(i=>+$('#rk'+i).value),[vv,ff,cc]=val,s=vv*ff/cc;
  const labels=[['1 个主体、静止','2 个元素','多人或多道具','多人 + 动作','多人 + 动作 + 特效'],['单张图','2–3 张关键帧','3 秒内短视频','5 秒视频','长镜头 / 一镜到底'],['只有一句话描述','有风格词','有锚点句','锚点句 + 参考图','参考图 + 锚点句 + 关键帧']];
  val.forEach((x,i)=>$('#rv'+i).textContent=labels[i][x-1]);
  const lv=s<=1.5?['低','var(--cyan)']:s<=4?['中','var(--yel)']:s<=10?['高','var(--org)']:['极高','var(--pink)'];
  const pct=Math.max(4,Math.min(100,Math.log(s/0.2)/Math.log(125)*100));
  const f=$('#rfill');f.style.width=pct+'%';f.style.background=lv[1];
  $('#rlevel').textContent='风险：'+lv[0];$('#rlevel').style.color=lv[1];$('#rscore').textContent=`（${vv} × ${ff}）÷ ${cc} ≈ ${s.toFixed(1)}`;
  $$('[data-tip]').forEach(li=>{const i=+li.dataset.tip;li.classList.toggle('hot',i===0?vv>=4:i===1?ff>=4:cc<=2)});
}

function playRhythm(i){

    <div class="grid3">${Y.lockMethods.map(m=>`<div class="card"><b>${m[0]} <span class="stars">${'★'.repeat(m[4])}</span></b><p>${m[1]}</p><p class="small">优点：${m[2]}</p><p class="small">最适合：${m[3]}</p></div>`).join('')}</div>
    <h4 class="h4">风格定调卡</h4>${formCard('tone','实训前必须填写。内容只保存在这台设备的浏览器里。',Y.toneCard)}`)+
  sect('y-face','捏脸机：告别 AI 标准脸','每一维各选一项组合，就能生成截然不同的脸。点格子手动挑，或者按系一键生成。',`
    <div class="faceacts"><button class="btn" data-act="face-rand">随机捏一张</button>${Y.faceSys.map((s,i)=>`<button class="btn ghost" data-fsys="${i}">${s}</button>`).join('')}</div>
    <div class="tblwrap"><table class="face"><thead><tr><th>维度</th>${Y.faceSys.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${Y.faceDims.map((d,i)=>`<tr><th>${d}</th>${Y.face[i].map((x,j)=>`<td><button data-fc="${i}-${j}">${x}</button></td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="faceout"><p class="small">面部描述（放进角色提示词的“面部”模块）</p><code id="face-out"></code><div class="acts"><button class="btn" data-act="face-copy">复制面部描述</button><button class="btn ghost" data-act="face-asym">加一条不对称细节</button></div>
      <p class="small" style="margin-top:14px">防平均脸负面词（必加）</p>${copyBox(DATA.prompts.find(p=>p.title.includes('平均脸')).template)}</div>
    <h4 class="h4">组合示例：6 张截然不同的脸</h4>
    <div class="grid3 facegal">${Y.faceGallery.map(f=>`<div class="card">${imgSlot(f[0])}<b>${f[1]}</b><p class="small">${f[2]}</p></div>`).join('')}</div>
    <h4 class="h4">为什么 AI 漫剧“共用一张脸”</h4>
    <div class="grid3">${Y.sameFace.map(s=>`<div class="card"><b>${s[0]}</b><p>${s[1]}</p></div>`).join('')}</div>
    <p class="note">口诀：特征库选脸 + 负面词拦平均 + 数字化不对称。</p>`)+
  sect('y-id','角色身份证','动笔前先填，AI 生成越精准。视觉锚点 = 让观众一眼记住这个角色的那个细节。',`
    <div class="grid2">${Y.idExamples.map(x=>`<div class="card idc">${imgSlot(x.n==='林夏'?'id-linxia':'id-xiaoyi')}<b>${x.n}</b><small class="tagline">${x.tag}</small><dl><dt>画风</dt><dd>${x.style}</dd><dt>服装</dt><dd>${x.cloth}</dd><dt>道具</dt><dd>${x.prop}</dd><dt>视觉锚点</dt><dd class="anchor">${x.anchor}</dd></dl></div>`).join('')}</div>
    <h4 class="h4">填一张你的角色身份证</h4>${formCard('idcard','',Y.idFields)}`)+
  sect('y-asset','角色资产 4 级体系','90% 新手的核心踩坑：未提前固定视觉资产。正确工作流：剧本 → 角色身份证 → 定妆照 → 三视图 → 道具资产 → 开始逐镜出图。',`
    <div class="grid4">${Y.assetLevels.map(a=>`<div class="card lvl">${imgSlot(['asset-makeup','asset-turnaround','asset-expression','asset-prop'][Y.assetLevels.indexOf(a)])}<span class="lv ${a[4]==='最优先'?'hi':''}">${a[0]} · ${a[4]}</span><b>${a[1]}</b><p>${a[2]}</p><p class="small">${a[3]}</p></div>`).join('')}</div>
    <p class="note">命名规范：EP集号_场景名_景别_时间_版本号.格式，例如 EP01_客厅_远景_傍晚_v2.png。提示词必须存档到同名 .txt 文件。</p>`)+
  sect('y-pit','生图十个坑','实训最高频的返工原因。',`<ol class="pits">${Y.tenPits.map(p=>`<li>${p}</li>`).join('')}</ol>`);
  expVF=makeVF($('#vf-exp'),{bare:true,size:2});const genVF=makeVF($('#vf-genre'),{vertical:true,bare:true,size:2});
  const setExp=k=>{const x=Y.experiment[k];$$('[data-exp]',v).forEach(b=>b.classList.toggle('on',b.dataset.exp===k));expVF.setGrade(x.grade);expVF.setLight(x.light);expVF.setComp(x.comp||'thirds');$('#exp-out').innerHTML=`<p class="big">${esc(x.t)}</p>${imgSlot(k==='a'?'exp-sweet':'exp-suspense')}`};setExp('a');
  const fsel=Y.faceDims.map(()=>0);let asym='';
  const face=()=>{$$('[data-fc]',v).forEach(b=>{const [i,j]=b.dataset.fc.split('-').map(Number);b.classList.toggle('on',fsel[i]===j)});
    $('#face-out').textContent='面部：'+Y.faceDims.map((d,i)=>d+'：'+Y.face[i][fsel[i]]).join('，')+(asym?'，'+asym:'')+'。'};
  face();
  v.addEventListener('click',e=>{
    const fc=e.target.closest('[data-famc],[data-fam].fam');if(fc){const k=fc.dataset.famc||fc.dataset.fam;$$('[data-famc]',v).forEach(b=>b.classList.toggle('on',b.dataset.famc===k));$$('.sc',v).forEach(s=>s.hidden=!(k==='全部'||s.dataset.fam===k));if(fc.dataset.fam)$('#fam-chips').scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})}
    const ex=e.target.closest('[data-exp]');if(ex)setExp(ex.dataset.exp);
    const gn=e.target.closest('[data-gen]');if(gn){const g=Y.genres[+gn.dataset.gen],p=g.play;$$('[data-gen]',v).forEach(b=>b.closest('.genre').classList.toggle('on',b===gn));
      const box=$('#vf-genre');const r=box.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)box.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});
      genVF.setGrade(g.grade);genVF.setLight(g.light);$('#gen-cap').textContent=`${g.n}：${g.p.join(' · ')}`;
      if(p.cuts)genVF.run(cutsToSteps(p.cuts));else genVF.shot(p.a,p.b,p.D)}
    const c=e.target.closest('[data-fc]');if(c){const [i,j]=c.dataset.fc.split('-').map(Number);fsel[i]=j;face()}
    const sy=e.target.closest('[data-fsys]');if(sy){fsel.fill(+sy.dataset.fsys);asym='';face()}
    if(e.target.closest('[data-act="face-rand"]')){fsel.forEach((_,i)=>fsel[i]=Math.floor(Math.random()*4));face()}
    if(e.target.closest('[data-act="face-asym"]')){asym=R(['眼间距比标准多 0.3cm','下颌角约 120°','左右眉毛略不对称'].filter(x=>x!==asym));face()}
    if(e.target.closest('[data-act="face-copy"]'))copy($('#face-out').textContent);
  });
}

/* ====================== 概念词典 ====================== */
function renderDict(){
  const v=$('#v-dict'),CO=['剧本','分镜','光影','生图','视频','诊断'],cats=['全部',...CO];const list=[...DATA.concepts].sort((a,b)=>CO.indexOf(a.cat)-CO.indexOf(b.cat));
  v.innerHTML=head('dict')+`<div class="dtool"><input id="dq" type="search" placeholder="筛选概念" aria-label="筛选概念"><div class="chips">${cats.map((c,i)=>`<button class="chip${i?'':' on'}" data-dc="${c}">${c}<small>${c==='全部'?DATA.concepts.length:DATA.concepts.filter(x=>x.cat===c).length}</small></button>`).join('')}</div><button class="btn ghost" id="flipall">全部翻开</button></div>
    <div class="dgrid">${list.map(c=>`<div class="fc" data-id="${c.id}" data-cat="${c.cat}" tabindex="0" role="button" aria-label="${esc(c.term)}，点击翻面"><div class="fc-in"><div class="fc-f"><span class="tag">${c.cat}</span><span class="term">${esc(c.term)}</span><span class="turn">点击翻面</span></div><div class="fc-b"><h4>${esc(c.term)}</h4><p>${esc(c.def)}</p>${c.ex?`<p class="ex">例：${esc(c.ex)}</p>`:''}${c.go?`<button class="go" data-go2="${c.go[0]}" data-gid2="${c.go[1]}">去看${MODS[c.go[0]].short} →</button>`:''}</div></div></div>`).join('')}</div>`;
  let cat='全部';
  const filt=()=>{const q=$('#dq').value.trim().toLowerCase();$$('.fc',v).forEach(el=>{const c=DATA.concepts.find(x=>x.id===el.dataset.id);el.hidden=!((cat==='全部'||c.cat===cat)&&(!q||(c.term+c.def+c.ex).toLowerCase().includes(q)))})};
  $('#dq').addEventListener('input',filt);
  v.addEventListener('click',e=>{
    const ch=e.target.closest('[data-dc]');if(ch){$$('[data-dc]',v).forEach(b=>b.classList.toggle('on',b===ch));cat=ch.dataset.dc;filt();return}
    if(e.target.id==='flipall'){const open=e.target.textContent==='全部翻开';$$('.fc',v).forEach(f=>f.classList.toggle('flip',open));e.target.textContent=open?'全部合上':'全部翻开';return}
    const g2=e.target.closest('[data-go2]');if(g2){jump(g2.dataset.go2,g2.dataset.gid2);return}
    const f=e.target.closest('.fc');if(f)f.classList.toggle('flip');
  });
  v.addEventListener('keydown',e=>{const f=e.target.closest('.fc');if(f&&e.target===f&&(e.key==='Enter'||e.key===' ')){e.preventDefault();f.classList.toggle('flip')}});
}

/* ====================== 全站搜索 ====================== */
let INDEX=[];
function buildIndex(){
  INDEX=[
    ...$$('.sect').map(s=>({k:s.closest('.view').id.slice(2),id:s.id,t:s.dataset.title,x:'章节',s:s.textContent.slice(0,400)})),
    ...D.cases.map(c=>({k:'diag',id:c.id,t:(c.code?c.code+' ':'')+c.title,x:c.cat+'｜'+c.why,s:c.bad+c.good+c.fix.join('')})),
    ...DATA.prompts.map(p=>({k:'prompt',id:p.id,t:p.title,x:p.cat+'｜'+p.use,s:p.template})),
    ...SZ.map(s=>({k:'shot',id:s.id,t:'景别：'+s.name,x:s.desc,s:s.en+s.use})),
    ...H.comps.map(s=>({k:'shot',id:s.id,t:'构图：'+s.name,x:s.desc,s:s.en+s.use})),
    ...H.lights.filter(l=>l.key!=='none').map(s=>({k:'shot',id:s.id,t:'光线：'+s.name,x:s.desc,s:s.en+s.use})),
    ...H.grades.filter(l=>l.key!=='none').map(s=>({k:'shot',id:s.id,t:'色调：'+s.name,x:s.desc,s:s.en+s.use})),
    ...H.angles.map(s=>({k:'shot',id:s.id,t:'机位：'+s.name,x:s.desc,s:s.en})),
    ...H.moves.map(s=>({k:'shot',id:s.id,t:'运镜：'+s.n,x:s.mood,s:s.en+s.use})),
    ...Y.styles.map(s=>({k:'style',id:s.id,t:s.name,x:s.fam+'｜'+s.fit,s:s.kw+s.feat})),
    ...DATA.concepts.map(c=>({k:'dict',id:c.id,t:c.term,x:c.def,s:c.ex}))
  ];
}
const q=$('#q'),res=$('#results');
q.addEventListener('input',()=>{
  const s=q.value.trim().toLowerCase();if(!s){res.hidden=true;return}
  const hits=INDEX.filter(i=>(i.t+i.x+i.s).toLowerCase().includes(s)).sort((a,b)=>(b.t.toLowerCase().includes(s)?1:0)-(a.t.toLowerCase().includes(s)?1:0)).slice(0,14);
  res.innerHTML=hits.length?hits.map(h=>`<button data-go="${h.k}" data-gid="${h.id}"><span class="stampmini" style="--c:${MODS[h.k].color}">${MODS[h.k].stamp}</span><span><span class="rt">${esc(h.t)}</span><span class="rx">${esc(h.x.slice(0,46))}${h.x.length>46?'…':''}</span></span></button>`).join(''):`<div class="empty">没有找到“${esc(q.value)}”。换个关键词，比如“一致性”“钩子”“三视图”。</div>`;
  res.hidden=false;
});
q.addEventListener('keydown',e=>{if(e.key==='Escape'){res.hidden=true;q.blur()}if(e.key==='Enter'){const b=$('button',res);b&&b.click()}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.hidden=true});
res.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;res.hidden=true;q.value='';jump(b.dataset.go,b.dataset.gid)});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus()}});
function jump(k,id){if(location.hash!=='#'+k)location.hash=k;setTimeout(()=>focusItem(k,id),cur===k?0:420)}
function focusItem(k,id){
  const v=$('#v-'+k),sm=RM?'auto':'smooth';
  if(k==='shot'){const p=id.slice(0,3),key=id.slice(3);
    if(p==='sz-'){shotVF.setSize(+key,true);$('#vf-shot').scrollIntoView({behavior:sm,block:'center'});return}
    if(p==='an-'){setAngle(+key);$('#h-angle').scrollIntoView({behavior:sm,block:'start'});return}
    if(p==='cp-'||p==='lt-'||p==='gr-'){pick({'cp-':'comp','lt-':'light','gr-':'grade'}[p],key);$('#explain').scrollIntoView({behavior:sm,block:'center'});return}}
  const reset=sel=>{const b=$(sel,v);b&&!b.classList.contains('on')&&b.click()};
  if(k==='diag')reset('[data-dxcat="全部"]');if(k==='prompt')reset('[data-pcat="全部"]');if(k==='style')reset('[data-famc="全部"]');
  if(k==='dict'){reset('[data-dc="全部"]');if($('#dq').value){$('#dq').value='';$('#dq').dispatchEvent(new Event('input'))}}
  const el=document.getElementById(id)||$(`[data-id="${id}"]`,v);if(!el)return;
  if(el.classList.contains('dx')&&!el.classList.contains('open'))$('.dx-h',el).click();
  if(el.classList.contains('fc'))el.classList.add('flip');
  el.scrollIntoView({behavior:sm,block:el.classList.contains('sect')?'start':'center'});
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
}

/* ====================== 抽一题 ====================== */
const POOL=[
  ...DATA.concepts.map(c=>({k:'dict',id:c.id,tag:'概念',q:`“${c.term}”是什么？`,a:`<p>${esc(c.def)}</p>${c.ex?`<p class="small">例：${esc(c.ex)}</p>`:''}`})),
  ...D.cases.map(c=>({k:'diag',id:c.id,tag:'诊断',q:`遇到“${c.title}”，为什么会这样、怎么解决？`,a:`<p>${esc(c.why)}</p><ol>${c.fix.map(f=>`<li>${esc(f)}</li>`).join('')}</ol>`})),
  ...S.hookJudge.map(h=>({k:'script',id:'s-hook',tag:'钩子',q:`这句是不是钩子？“${h.t}”`,a:`<p><b>${h.y?'✓ 是钩子':'✗ 不是钩子'}</b>：${esc(h.why)}</p><p class="small">${h.y?'接':'改'}：${esc(h.next)}</p>`})),
  ...SZ.map(s=>({k:'shot',id:s.id,tag:'景别',q:`“${s.name}”拍到哪里，常用在什么时候？`,a:`<p>${esc(s.desc)}</p><p>${esc(s.use)}</p><p class="small">建议时长 ${s.dur}</p>`}))
];
function quiz(){
  const it=R(POOL),m=$('#modal'),c=$('#mcard');
  c.innerHTML=`<button class="x" aria-label="关闭" data-close>×</button><span class="tag" style="background:${MODS[it.k].color};color:var(--ink)">${it.tag}</span><p class="q">${esc(it.q)}</p><div class="a" hidden>${it.a}</div>
    <div class="acts"><button class="btn" style="--c:var(--yel)" data-reveal>看答案</button><button class="btn ghost" data-next>换一题</button><button class="btn ghost" data-src>去原文</button></div>`;
  m.hidden=false;
  c.onclick=e=>{if(e.target.closest('[data-close]')){m.hidden=true;return}if(e.target.closest('[data-next]')){quiz();return}
    if(e.target.closest('[data-reveal]')){$('.a',c).hidden=false;e.target.closest('[data-reveal]').remove();return}if(e.target.closest('[data-src]')){m.hidden=true;jump(it.k,it.id)}};
  $('[data-reveal]',c).focus();
}
$('#dice').addEventListener('click',quiz);
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').hidden=true});

/* ---------- 全局点击 ---------- */
document.addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');if(cp){copy(cp.dataset.copy);return}
    const r=e.target.closest('[data-act="reveal"]');if(r){r.parentElement.classList.remove('locked');r.remove();return}
  const j=e.target.closest('[data-jump]');if(j){const el=document.getElementById(j.dataset.jump);el&&el.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});return}
  const f=e.target.closest('[data-form] [data-act]');if(f){const box=f.closest('[data-form]');
    if(f.dataset.act==='form-copy')copy($$('textarea',box).map(t=>`${t.dataset.label}：${t.value.trim()||'（未填）'}`).join('\n'));
    if(f.dataset.act==='form-clear'&&confirm('清空这张卡片的全部内容？')){$$('textarea',box).forEach(t=>t.value='');store.set('form-'+box.dataset.form,{})}}
  if(e.target.closest('[data-act="ck-reset"]')&&confirm('清空全部勾选？')){store.set('check',{});renderChecks()}
});

/* ---------- 章节导航高亮 ---------- */
function watchSections(k){
  const v=$('#v-'+k),nav=$('.subnav',v);if(!nav||!('IntersectionObserver' in window))return;
  const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){$$('[data-jump]',nav).forEach(b=>{const on=b.dataset.jump===en.target.id;b.classList.toggle('on',on);if(on){const inn=b.parentElement;inn.scrollTo({left:b.offsetLeft-inn.clientWidth/2+b.offsetWidth/2,behavior:RM?'auto':'smooth'})}})}})},{rootMargin:'-35% 0px -60% 0px'});
  $$('.sect',v).forEach(s=>io.observe(s));
}

/* ---------- 导航与转场 ---------- */
let cur=null;
const navHTML=cls=>['home',...ORDER].map(k=>`<a href="#${k}" data-nav="${k}" style="--c:${MODS[k].color}">${cls?`<span class="st">${MODS[k].stamp}</span>${MODS[k].short}`:MODS[k].short}</a>`).join('');
$('#tabs').innerHTML=navHTML(false);$('#bottombar').innerHTML=navHTML(true);
function go(k){
  if(!MODS[k])k='home';if(k===cur)return;
  const swap=()=>{$$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+k));$$('[data-nav]').forEach(a=>{a.classList.toggle('on',a.dataset.nav===k);a.toggleAttribute('aria-current',a.dataset.nav===k)});
    const prev=cur;cur=k;window.scrollTo(0,0);if(k==='home'&&prev!==null)heroIntro()};
  if(RM||cur===null){swap();return}
  const w=$('#wipe');w.style.setProperty('--c',MODS[k].color);$('span',w).textContent=MODS[k].stamp;w.classList.remove('run');void w.offsetWidth;w.classList.add('run');setTimeout(swap,230);
}
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
function setHH(){const h=$('.top').offsetHeight;document.documentElement.style.setProperty('--hh',h+'px')}
window.addEventListener('resize',setHH);

/* ---------- 启动 ---------- */
if(store.get('showall',false))document.body.classList.add('show-all');
if(new URLSearchParams(location.search).has('slots')){document.body.classList.add('slots','show-all');const b=document.createElement('div');b.id='slotbar';document.body.appendChild(b);slotCount()}
['home','diag','script','shot','prompt','style','dict'].forEach(k=>$('#v-'+k).style.setProperty('--c',MODS[k].color));
renderHome();renderDiag();renderScript();renderShot();renderPrompt();renderStyle();renderDict();
ORDER.forEach(watchSections);buildIndex();setHH();
go(location.hash.slice(1)||'home');if(cur==='home')heroIntro();

</script>
